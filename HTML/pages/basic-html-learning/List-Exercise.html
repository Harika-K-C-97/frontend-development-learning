<!DOCTYPE html>
<html>

<head>
	<title>HTML Lists</title>
	<link rel="shortcut icon" href="images/favicon.ico" />
	<!-- CSS for the table (this is an HTML comment) -->
	<style>
		table,
		td {
			border: 1px solid black;
			padding: 5px;
			text-align: center;
		}
	</style>
</head>

<body>
	<table>
		<tr>
			<td>UNORDERED LIST</td>
			<td>ORDERED LIST</td>
		</tr>
		<tr>
			<td>
				<ul>
					<li>Sooji</li>
					<li>Tomato</li>
					<li>Onion</li>
					<li>Chilli</li>
					<li>Salt</li>
					<li>Curry Leaves</li>
					<li>Corriander</li>
				</ul>
			</td>
			<td>
				<ol type="I">
					<li>Milk</li>
					<li>Water</li>
					<li>Tea powder</li>
					<li>Sugar</li>
					<li>Cardamom</li>
					<li>Ginger</li>
				</ol>
			</td>
		</tr>
	</table>
</body>
<html>
